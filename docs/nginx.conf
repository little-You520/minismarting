worker_processes  1;

events {
    worker_connections  1024;
}

# RTMP服务配置
rtmp {
    server {
        listen 1935;           # RTMP 推流端口
        chunk_size 4096;

        application live {
            live on;
            meta on;
            allow play all;
            allow publish all;

            # HLS切片配置（切片存储到 ./html/hls/ 目录）
            hls on;
            hls_path ./html/hls;         # 使用相对路径，指向当前目录下的 html/hls
            hls_fragment 5s;
            hls_playlist_length 30s;
            hls_continuous on;
            hls_cleanup on;               # 自动清理旧的切片文件
            hls_nested on;                # 为每个流创建独立文件夹
            hls_type live;
            hls_fragment_naming system;
        }
    }
}

# HTTP服务配置
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        off;
    tcp_nopush     on;
    keepalive_timeout  65;

    server {
        listen       8068;      # HTTP 服务端口（访问 HLS 流用）
        server_name  localhost;

        # HLS 播放地址：http://localhost:8068/hls/流名.m3u8
        location /hls {
            # 跨域头，允许前端网页（如 localhost:5174）访问
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            add_header 'Access-Control-Allow-Headers' 'Range';
            add_header Cache-Control no-cache;

            # 指向切片存储目录 ./html/hls
           root ./html; 

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # RTMP 统计页面（可选，用于查看推流状态）
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root ./;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}